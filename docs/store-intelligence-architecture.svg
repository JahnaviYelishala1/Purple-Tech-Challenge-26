<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Store Intelligence Architecture</title>
  <desc id="desc">Architecture flow from CCTV cameras to YOLOv8, tracking, event publishing, FastAPI, SQLite, analytics, and the dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { stroke-width: 2; rx: 14; ry: 14; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 18px; }
      .line { stroke: #94a3b8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .section { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" />
  <text class="section" x="800" y="60">Store Intelligence Architecture</text>

  <rect class="box" x="70" y="130" width="170" height="70" fill="#dbeafe" stroke="#2563eb" />
  <text class="label small" x="155" y="165">CAM2 / CAM5</text>

  <rect class="box" x="270" y="130" width="170" height="70" fill="#dcfce7" stroke="#16a34a" />
  <text class="label small" x="355" y="165">YOLOv8</text>

  <rect class="box" x="470" y="130" width="170" height="70" fill="#fef3c7" stroke="#f59e0b" />
  <text class="label small" x="555" y="165">Tracking</text>

  <rect class="box" x="670" y="130" width="200" height="70" fill="#ffe4e6" stroke="#e11d48" />
  <text class="label small" x="770" y="165">Event Publisher</text>

  <rect class="box" x="910" y="130" width="170" height="70" fill="#ede9fe" stroke="#7c3aed" />
  <text class="label small" x="995" y="165">FastAPI</text>

  <rect class="box" x="1110" y="130" width="170" height="70" fill="#e0f2fe" stroke="#0284c7" />
  <text class="label small" x="1195" y="165">SQLite</text>

  <rect class="box" x="420" y="320" width="520" height="80" fill="#f8fafc" stroke="#0f172a" />
  <text class="label" x="680" y="362">Metrics · Funnel · Heatmap · Anomalies</text>

  <rect class="box" x="590" y="520" width="220" height="80" fill="#eff6ff" stroke="#1d4ed8" />
  <text class="label" x="700" y="562">Streamlit Dashboard</text>

  <line class="line" x1="240" y1="165" x2="270" y2="165" />
  <line class="line" x1="440" y1="165" x2="470" y2="165" />
  <line class="line" x1="640" y1="165" x2="670" y2="165" />
  <line class="line" x1="870" y1="165" x2="910" y2="165" />
  <line class="line" x1="1080" y1="165" x2="1110" y2="165" />
  <line class="line" x1="1195" y1="200" x2="1195" y2="250" />
  <line class="line" x1="1195" y1="250" x2="680" y2="250" />
  <line class="line" x1="680" y1="250" x2="680" y2="320" />
  <line class="line" x1="680" y1="400" x2="680" y2="510" />
</svg>