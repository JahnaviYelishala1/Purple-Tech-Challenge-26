services:
  - type: web
    name: store-intelligence-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: store-intelligence-db
          property: connectionString

  - type: web
    name: store-intelligence-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: API_BASE_URL
        sync: false
      - key: DEFAULT_STORE_ID
        value: STORE_BLR_001

databases:
  - name: store-intelligence-db
    plan: free
    databaseName: store_intelligence
    user: store_intelligence
