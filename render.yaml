services:
  - type: web
    name: jahnavi-purple-tech-challenge-2026
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: purple-tech-challenge-2026
          property: connectionString
      - key: DEMO_SEED_ON_STARTUP
        value: "true"

  - type: web
    name: jahnavi-purple-tech-challenge-2026-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: API_BASE_URL
        fromService:
          type: web
          name: jahnavi-purple-tech-challenge-2026
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEFAULT_STORE_ID
        value: STORE_BLR_001

databases:
  - name: purple-tech-challenge-2026
    plan: free
    databaseName: store_intelligence
    user: store_intelligence
